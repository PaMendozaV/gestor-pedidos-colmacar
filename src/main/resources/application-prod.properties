# Perfil de produccion: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# o java -jar app.jar --spring.profiles.active=prod. Ningun secreto vive en el codigo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

colmacar.modo=${COLMACAR_MODO:real}
colmacar.url-publica=${URL_PUBLICA}

# Para crear los 3 usuarios iniciales: DATOS_DEMO=true en el primer arranque junto con DEMO_CLAVE_*
colmacar.datos-demo=false
colmacar.demo.clave-admin=${DEMO_CLAVE_ADMIN}
colmacar.demo.clave-cliente=${DEMO_CLAVE_CLIENTE}
colmacar.demo.clave-repartidor=${DEMO_CLAVE_REPARTIDOR}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
colmacar.bodega.api-key=${BODEGA_API_KEY}

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
