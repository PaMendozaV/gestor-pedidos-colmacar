spring.application.name=gestor-pedidos-colmacar
server.port=${PORT:8080}

# ---- PostgreSQL (esquema gestionado por Flyway: db/migration V1, V2...) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/colmacar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# BD existente del catalogo Flask: se marca como version 1 y solo se aplica V2 en adelante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---- Tienda ----
colmacar.mayorista.umbral=50
colmacar.tienda.whatsapp=${TIENDA_WHATSAPP:584247668718}

# ---- ImageKit (subida de imagenes del admin). La llave privada SOLO por variable de entorno ----
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.upload-url=https://upload.imagekit.io/api/v1/files/upload
imagekit.carpeta=/productos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- Modo de automatizacion ----
colmacar.modo=${COLMACAR_MODO:simulado}

# ---- Admin inicial ----
colmacar.admin.usuario=${ADMIN_USUARIO:admin}
colmacar.admin.clave-inicial=${ADMIN_CLAVE_INICIAL:}

# ---- Datos y usuarios demo ----
colmacar.datos-demo=${DATOS_DEMO:false}
colmacar.demo.clave-admin=${DEMO_CLAVE_ADMIN:admin123}
colmacar.demo.clave-cliente=${DEMO_CLAVE_CLIENTE:cliente123}
colmacar.demo.clave-repartidor=${DEMO_CLAVE_REPARTIDOR:repartidor123}

# ---- Motor automatico (solo modo simulado) ----
colmacar.motor.habilitado=true
colmacar.motor.intervalo-ms=1000
colmacar.motor.pago-ms=4000
colmacar.motor.preparacion-ms=6000
colmacar.pasarela.probabilidad-aprobacion=0.8

# ---- Pasarela Stripe (modo prueba) ----
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
colmacar.stripe.expira-minutos=60
colmacar.stripe.permitir-live=false
colmacar.url-publica=${URL_PUBLICA:http://localhost:8080}

# ---- Bodega ----
colmacar.bodega.api-key=${BODEGA_API_KEY:bodega-local-demo}