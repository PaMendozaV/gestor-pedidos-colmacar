<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Grupo Colmacar</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina-login">
  <main class="login">
    <div class="marca">
      <div class="sello" aria-hidden="true">GC</div>
      <h1>Crear cuenta <small>Cliente de Grupo Colmacar</small></h1>
    </div>
    <p class="aviso error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}" role="alert"></p>
    <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
      <div class="campo">
        <label for="username">Usuario</label>
        <input id="username" th:field="*{username}" autocomplete="username" required maxlength="50">
        <span class="error-campo" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
      </div>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" th:field="*{nombre}" autocomplete="name" required maxlength="100">
        <span class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
      </div>
      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="email" required maxlength="120">
        <span class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>
      <div class="campo">
        <label for="telefono">Teléfono <span class="ayuda">(opcional)</span></label>
        <input id="telefono" type="tel" th:field="*{telefono}" autocomplete="tel" maxlength="20">
        <span class="error-campo" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72">
        <span class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      </div>
      <div class="campo">
        <label for="confirmacion">Repite la contraseña</label>
        <input id="confirmacion" type="password" name="confirmacion" autocomplete="new-password" required>
        <span class="error-campo" th:if="${#fields.hasErrors('confirmacion')}" th:errors="*{confirmacion}"></span>
      </div>
      <button class="btn btn-primario" type="submit">Crear cuenta</button>
    </form>
    <p class="pie-login">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
  </main>
</body>
</html>
